        hprofPrimitiveScalarOutput.reset()
        commandLine "${System.getProperty('java.home')}/bin/java",
                '-cp', "${buildDir}/RunJPF.jar${File.pathSeparator}${buildDir}/deps/*",
                'gov.nasa.jpf.tool.RunJPF',
                "+hprof.file=${hprofPrimitiveScalarDump.absolutePath}",
                hprofPrimitiveScalarConfig.absolutePath
        standardOutput = hprofPrimitiveScalarOutput
    }
    doLast {
        String output = hprofPrimitiveScalarOutput.toString('UTF-8')
        print output
        def requiredDiagnostics = [
                '[HPROF-JPF] import complete: objects=2 arrays=0 mappings=2 primitiveFields=9 references=1 arrayElements=0',
                '[HPROF-JPF] primitive BOOLEAN booleanValue=true',
                '[HPROF-JPF] primitive BYTE byteValue=-7',
                '[HPROF-JPF] primitive CHAR charValue=U+03A9',
                '[HPROF-JPF] primitive SHORT shortValue=30000',
                '[HPROF-JPF] primitive INT intValue=123456789',
                '[HPROF-JPF] primitive LONG longValue=0x0123456789ABCDEF',
                '[HPROF-JPF] primitive FLOAT floatValue=13.25 bits=',
                '[HPROF-JPF] primitive DOUBLE doubleValue=-12345.125 bits=',
                '[HPROF-JPF-MODEL] primitive scalar values verified',
                '[HPROF-JPF] primitive-scalar controlled GC verified: cycles=1',
                '[HPROF-JPF-MODEL] post-GC primitive scalar values verified',
                'no errors detected'
        ]
        requiredDiagnostics.each { diagnostic ->
            if (!output.contains(diagnostic)) {
                throw new GradleException(
