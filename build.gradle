def hprofLifecycleUnresolvedOutput = new ByteArrayOutputStream()

tasks.register('rejectHprofLifecycleMissingMetadata', Exec) {
    group = "verification"
    description = "Rejects a selected <clinit> class without lifecycle metadata."
    dependsOn buildJars
    dependsOn generateHprofClassInitUninitializedDump
    ignoreExitValue = true
    outputs.upToDateWhen { false }
    doFirst {
        hprofLifecycleMissingOutput.reset()
        commandLine "${System.getProperty('java.home')}/bin/java",
                '-cp', "${buildDir}/RunJPF.jar${File.pathSeparator}${buildDir}/deps/*",
                'gov.nasa.jpf.tool.RunJPF',
                "+hprof.file=${hprofClassInitUninitializedDump.absolutePath}",
                hprofLifecycleMissingConfig.absolutePath
        standardOutput = hprofLifecycleMissingOutput
        errorOutput = hprofLifecycleMissingOutput
    }
    doLast {
        String output = hprofLifecycleMissingOutput.toString('UTF-8')
        if (!output.contains("[SEVERE] JPF exception")
                || !output.contains('with <clinit> requires explicit lifecycle metadata')) {
            throw new GradleException("Missing lifecycle metadata did not fail closed:\n${output}")
        }
        println '[HPROF-JPF] invalid metadata rejected: selected <clinit> class has no lifecycle entry'
    }
}

